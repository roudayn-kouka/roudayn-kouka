name: Generate profile graphs (snake + activity)

on:
  schedule:
    - cron: "0 */6 * * *"    # every 6 hours
  workflow_dispatch:          # run it manually the first time
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  graphs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake (plum / rose / lilac palette)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-plum.svg?color_snake=#f472b6&color_dots=#2a0f36,#5b2168,#8b3a9c,#c084fc,#f9a8d4&color_dot_border=#0c0814

      - name: Generate activity graph (last 31 days)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/activity_graph.py dist/activity-graph.svg

      - name: Push to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
