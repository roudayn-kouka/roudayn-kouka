<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="DevSecOps pipeline: code, build, SAST, SCA, image scan, push, GitOps sync, run on Kubernetes, observe">
