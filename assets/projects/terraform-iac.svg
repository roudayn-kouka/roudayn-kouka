      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="0.75" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="440 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow_terraform-iac" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
