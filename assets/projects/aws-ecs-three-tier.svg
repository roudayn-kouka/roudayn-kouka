  <text x="26" y="110" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#c9b3d9">Highly available containerised architecture: ECS</text><text x="26" y="131" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#c9b3d9">services, RDS Multi-AZ, ElastiCache and S3.</text>
