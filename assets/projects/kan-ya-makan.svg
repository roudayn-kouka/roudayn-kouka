  <text x="26" y="110" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#c9b3d9">Turns a prompt, a PDF or a library book into a 3D</text><text x="26" y="131" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#c9b3d9">video story for children, with adaptations for</text><text x="26" y="152" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#c9b3d9">dyslexia, ADHD, colour blindness and sign language.</text>
