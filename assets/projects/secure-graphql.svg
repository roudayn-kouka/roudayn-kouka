  <text x="26" y="40" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" letter-spacing="2" fill="#67e8f9">APPSEC · API</text>
  <text x="26" y="76" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="800" fill="#f5e8ff">Secure GraphQL API</text>
  
  <text x="26" y="110" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#c9b3d9">Recipe API on an Apollo GraphQL server, secured</text><text x="26" y="131" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#c9b3d9">with Keycloak authentication and role-based access</text><text x="26" y="152" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#c9b3d9">control (RBAC).</text>
