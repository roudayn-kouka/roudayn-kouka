<svg xmlns="http://www.w3.org/2000/svg" width="440" height="230" viewBox="0 0 440 230" role="img" aria-label="Secure GraphQL API">
  <defs>
    <linearGradient id="bg_secure-graphql" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e0828"/><stop offset="1" stop-color="#0c0814"/></linearGradient>
    
    <linearGradient id="h_secure-graphql" x1="0" y1="0" x2="440" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="0.25" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="0.75" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="440 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow_secure-graphql" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#67e8f9" stop-opacity="0.35"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></radialGradient>
