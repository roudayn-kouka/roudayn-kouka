    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="26" y="40" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" letter-spacing="2" fill="#f472b6">DEVSECOPS · AWS EKS</text>
  <text x="26" y="76" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="800" fill="#f5e8ff">Three-Tier App on EKS</text>
  
  <text x="26" y="110" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#c9b3d9">MERN app on Amazon EKS: Terraform infra, Jenkins CI</text><text x="26" y="131" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#c9b3d9">with SonarQube &amp; Trivy gates, ECR, GitOps with</text><text x="26" y="152" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#c9b3d9">ArgoCD, Prometheus/Grafana monitoring.</text>
